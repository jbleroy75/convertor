name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests sans outils système (les conversions réelles sont testées en local / dans l'image).
      - run: node --test test/crypto.test.js test/data.test.js test/transfer.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://convertor.jbleroy.fr' }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::Secrets COOLIFY_WEBHOOK / COOLIFY_TOKEN absents : déploiement ignoré (voir README)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier que ce commit est toujours la tête de main
        id: head
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # Coolify déploie la tête de la branche, pas un commit précis : si un push plus récent
          # est arrivé, on ne déploie pas (le workflow de ce push déploiera après SES tests).
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main a avancé ($head) : déploiement laissé au workflow du commit le plus récent."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher le déploiement Coolify
        id: trigger
        if: steps.cfg.outputs.skip != 'true' && steps.head.outputs.skip != 'true'
        run: |
          res=$(curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          echo "$res" | jq -r '.deployments[]?.message // empty'
          dep=$(echo "$res" | jq -r '.deployments[0].deployment_uuid // empty')
          [ -n "$dep" ] || { echo "::error::Réponse inattendue de Coolify : $res"; exit 1; }
          echo "uuid=$dep" >> "$GITHUB_OUTPUT"
          # Base de l'API Coolify, déduite de l'URL du webhook (…/api/v1/deploy?uuid=…).
          echo "api=${COOLIFY_WEBHOOK%%/api/v1/*}/api/v1" >> "$GITHUB_OUTPUT"

      - name: Suivre le build
        if: steps.trigger.outcome == 'success'
        env:
          API: ${{ steps.trigger.outputs.api }}
          DEP: ${{ steps.trigger.outputs.uuid }}
        run: |
          # Jusqu'à 30 minutes au total (le premier build installe LibreOffice, FFmpeg…).
          deadline=$((SECONDS + 1800))
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            d=$(curl -fsS --max-time 20 -H "Authorization: Bearer $COOLIFY_TOKEN" "$API/deployments/$DEP" || echo '{}')
            status=$(echo "$d" | jq -r '.status // "inconnu"')
            [ "$status" != "$last" ] && echo "[$(date -u +%H:%M:%S)] statut : $status" && last="$status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*|error)
                echo "::group::Logs de build Coolify (fin)"
                echo "$d" | jq -r '.logs // "[]" | (fromjson? // []) | .[] | select(.hidden != true) | .output' | tail -n 150
                echo "::endgroup::"
                echo "::error::Le déploiement Coolify a échoué ($status)"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Délai dépassé en attendant Coolify"
          exit 1

      - name: Vérifier que le site répond
        if: steps.trigger.outcome == 'success'
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$PUBLIC_URL/healthz"; then echo; echo "En ligne : $PUBLIC_URL"; exit 0; fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL/healthz ne répond pas après 3 minutes"
          exit 1
